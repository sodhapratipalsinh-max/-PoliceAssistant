name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o PoliceAssistant.zip || true
          if [ -d PoliceAssistant ]; then
            cp -r PoliceAssistant/..
            rm -rf PoliceAssistant
          fi
          rm -f PoliceAssistant.zip
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          chmod +x gradlew
        ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoliceAssistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
